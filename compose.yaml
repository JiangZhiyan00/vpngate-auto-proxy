services:
  proxy:
    build: .
    image: vpngate-auto-proxy:local
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
      - SETUID
      - SETGID
      - SETPCAP
      - KILL
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv4.ip_forward: "1"
    tmpfs:
      - /run:rw,nosuid,nodev,mode=0755
      - /tmp:rw,nosuid,nodev,mode=1777
    volumes:
      - type: bind
        source: ${VAP_CONFIG_FILE:-./deploy/config.container.example.json}
        target: /etc/vap/config.json
        read_only: true
      - proxy-data:/var/lib/vap
    secrets:
      - proxy_credentials
    ports:
      - "${VAP_BIND_ADDRESS:-127.0.0.1}:${VAP_PORT:-1080}:1080"
    stop_grace_period: 15s
secrets:
  proxy_credentials:
    file: ./credentials.local.json
volumes:
  proxy-data:
