# 与根目录 compose.yaml 合并；清除构建配置，直接启动已发布镜像。
services:
  proxy:
    build: !reset null
    image: ${VAP_IMAGE:?请设置已发布的 Docker Hub 仓库及版本标签}
    platform: linux/amd64
    pull_policy: missing
    volumes: !override
      - proxy-data:/var/lib/vap
    environment:
      VAP_CONFIG_MODE: environment
      VAP_COUNTRIES: ${VAP_COUNTRIES:-}
      VAP_TIMEZONE: ${VAP_TIMEZONE:-}
      VAP_LOG_LEVEL: ${VAP_LOG_LEVEL:-}
      VAP_LOG_SUMMARY_INTERVAL_SECONDS: ${VAP_LOG_SUMMARY_INTERVAL_SECONDS:-}
      VAP_SOURCE_URL: ${VAP_SOURCE_URL:-}
      VAP_ALLOW_LEGACY_VPNGATE_CRYPTO: ${VAP_ALLOW_LEGACY_VPNGATE_CRYPTO:-}
      VAP_EXIT_CHECK_URLS: ${VAP_EXIT_CHECK_URLS:-}
      VAP_SOURCE_REFRESH_SECONDS: ${VAP_SOURCE_REFRESH_SECONDS:-}
      VAP_SOURCE_TIMEOUT_SECONDS: ${VAP_SOURCE_TIMEOUT_SECONDS:-}
      VAP_SOURCE_CACHE_TTL_SECONDS: ${VAP_SOURCE_CACHE_TTL_SECONDS:-}
      VAP_CANDIDATE_INTERVAL_SECONDS: ${VAP_CANDIDATE_INTERVAL_SECONDS:-}
      VAP_CANDIDATE_RESULT_TTL_SECONDS: ${VAP_CANDIDATE_RESULT_TTL_SECONDS:-}
      VAP_CANDIDATE_BATCH_SIZE: ${VAP_CANDIDATE_BATCH_SIZE:-}
      VAP_CANDIDATE_CONCURRENCY: ${VAP_CANDIDATE_CONCURRENCY:-}
      VAP_PORT_PROBE_TIMEOUT_SECONDS: ${VAP_PORT_PROBE_TIMEOUT_SECONDS:-}
      VAP_TUNNEL_TIMEOUT_SECONDS: ${VAP_TUNNEL_TIMEOUT_SECONDS:-}
      VAP_EXIT_CHECK_TIMEOUT_SECONDS: ${VAP_EXIT_CHECK_TIMEOUT_SECONDS:-}
      VAP_EXIT_CHECK_MAX_ATTEMPTS: ${VAP_EXIT_CHECK_MAX_ATTEMPTS:-}
      VAP_HEALTH_INTERVAL_SECONDS: ${VAP_HEALTH_INTERVAL_SECONDS:-}
      VAP_HEALTH_TIMEOUT_SECONDS: ${VAP_HEALTH_TIMEOUT_SECONDS:-}
      VAP_CANDIDATE_RETRIES: ${VAP_CANDIDATE_RETRIES:-}
      VAP_RETRY_INITIAL_SECONDS: ${VAP_RETRY_INITIAL_SECONDS:-}
      VAP_RETRY_MAX_SECONDS: ${VAP_RETRY_MAX_SECONDS:-}
      VAP_MAX_CONNECTIONS: ${VAP_MAX_CONNECTIONS:-}
      VAP_SHUTDOWN_TIMEOUT_SECONDS: ${VAP_SHUTDOWN_TIMEOUT_SECONDS:-}
